<svg viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#33c7b7" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#163766" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#10233d"/>
      <stop offset="100%" stop-color="#0c1b2f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="1464" height="724" rx="24" fill="url(#bgGlow)" stroke="rgba(255,255,255,.08)"/>
  <g stroke="#53d7ca" stroke-opacity=".45" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M130 115 H245"/>
    <path d="M405 115 H520"/>
    <path d="M680 115 H795"/>
    <path d="M955 115 H1070"/>
    <path d="M1230 115 H1345"/>
    <path d="M1405 145 V245 H1345"/>
    <path d="M1230 275 H1120"/>
    <path d="M1060 305 V405 H1120"/>
    <path d="M1230 435 H1345"/>
    <path d="M1405 465 V565 H1345"/>
    <path d="M1230 595 H1120"/>
  </g>
  <g font-family="Inter, sans-serif" filter="url(#softShadow)">
    <g transform="translate(40,70)">
      <rect width="190" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D0 · MANDATE</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Evaluate target</text>
    </g>
    <g transform="translate(255,70)">
      <rect width="250" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D1 · INTEGRITY</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Can we trust the numbers?</text>
    </g>
    <g transform="translate(530,70)">
      <rect width="250" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D2 · STRATEGIC FIT</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Is the asset durable?</text>
    </g>
    <g transform="translate(805,70)">
      <rect width="250" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D3 · VALUATION</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">What is it worth?</text>
    </g>
    <g transform="translate(1080,70)">
      <rect width="250" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D4 · STRUCTURE</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">How do we finance it?</text>
    </g>
    <g transform="translate(1310,200)">
      <rect width="150" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D5 · MARKETS</text>
      <text x="18" y="57" font-size="22" fill="#ffffff" font-weight="800">How will markets react?</text>
    </g>
    <g transform="translate(870,260)">
      <rect width="250" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D6 · NEGOTIATION</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Counteroffer arrives</text>
    </g>
    <g transform="translate(1090,390)">
      <rect width="240" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D7 · THIRD-PARTY BIDDER</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Do we escalate or exit?</text>
    </g>
    <g transform="translate(1310,520)">
      <rect width="150" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D8 · REGULATORS</text>
      <text x="18" y="57" font-size="22" fill="#ffffff" font-weight="800">Will the deal clear?</text>
    </g>
    <g transform="translate(870,580)">
      <rect width="240" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D9 · FINAL COMMITMENT</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Proceed, renegotiate, or walk</text>
    </g>
    <g transform="translate(1090,580)">
      <rect width="240" height="90" rx="18" fill="url(#nodeFill)" stroke="rgba(255,255,255,.10)"/>
      <text x="18" y="28" font-size="12" fill="#77e9dc" font-weight="800" letter-spacing="1.2">D10 · INTEGRATION</text>
      <text x="18" y="57" font-size="24" fill="#ffffff" font-weight="800">Did the thesis hold?</text>
    </g>
  </g>
  <g font-family="Inter, sans-serif">
    <text x="74" y="220" font-size="13" fill="#aab7cc">Integrity failure can re-route valuation, deal structure, or go/no-go entirely.</text>
    <text x="870" y="228" font-size="13" fill="#aab7cc">Each node changes the economics, the risk, or the conditions for proceeding.</text>
    <text x="1035" y="710" font-size="13" fill="#aab7cc">AAIDIS evaluates the full path, not just the next move.</text>
  </g>
</svg>
